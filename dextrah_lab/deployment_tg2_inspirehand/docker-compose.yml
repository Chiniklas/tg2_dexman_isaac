services:
  workspace:
    image: tiangong_infra_ws:noetic
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiangong_noetic_ws
    hostname: tiangong-noetic-ws
    working_dir: /tiangong_infra_ws
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,graphics}"
      ROS_HOSTNAME: "${ROS_HOSTNAME:-tiangong-noetic-ws}"
      ROS_MASTER_URI: "${ROS_MASTER_URI:-http://tiangong-noetic-ws:11311}"
    volumes:
      - ./:/tiangong_infra_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    privileged: true  # allow access to host camera devices (/dev/video*)
    extra_hosts:
      - "tiangong-noetic-ws:127.0.0.1"
    network_mode: host
    stdin_open: true   # allow interactive shell
    tty: true          # allocate a TTY
    # no 'command:' here → run.sh will drop you into a shell
