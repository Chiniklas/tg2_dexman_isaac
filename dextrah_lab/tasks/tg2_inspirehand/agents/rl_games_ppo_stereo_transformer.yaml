params:
  seed: -1

  # environment wrapper clipping
  env:
    # added to the wrapper
    clip_observations: 5.0
    # can make custom wrapper?
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: a2c_stereo_transformer
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      # units: [8192, 4096, 2048, 1024]
      units: [512, 512, 256]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: True
      layer_norm: True
    aux_network: 
      mlp:
        units: [512, 256]
        activation: elu
        out_activation: None # just nn linear layer on output
        d2rl: False

        initializer:
          name: default
        regularizer:
          name: None

    aux_outputs:
      object_pos: {size: 3}

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: shadow_hand_openai_lstm
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    num_actors: -1  # configured from the script (based on num_envs)
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 64
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    seq_length: 1 # default 20
    bounds_loss_coef: 0.0001

  distillation:
    imitation_loss_type: l2
    imitation_target: null
    loss_type: null
    unsafe_mode: l2
    unsafe_l2_threshold: 3.0 # default 3.0
    unsafe_l2_threshold_mode: fixed # fixed | anneal
    # threshold annealing settings
    unsafe_l2_threshold_start: 3.0
    unsafe_l2_threshold_end: 2.0
    unsafe_l2_threshold_anneal_iters: 100000
    
    failure_predictor:
      enabled: false
      obs_key: ood_policy_embed
      hidden_sizes: [256, 128]
      lr: 0.001
      dropout: 0.0
      buffer_size: 100000
      batch_size: 1024
      min_samples: 10000 # default 10000
      update_interval: 250
      train_steps: 5
      horizon_steps: 15
      failure_threshold: 0.6
      include_current_step: false
      pos_weight: 2.0
      device: cuda
    ood:
      enabled: false
      type: gaussian
      obs_key: policy # defines which obs does the classifier see
      buffer_size: 100000
      min_samples: 5000
      update_interval: 1000
      threshold_quantile: 0.99
      diag_eps: 1e-4
      hidden_sizes: [256, 128]
      lr: 0.001
      weight_decay: 1.0e-6
      batch_size: 1024
      train_steps: 100
      noise_std: 0.1
      threshold_samples: 50000
      dropout_prob: 0.1
      device: cpu

    # central_value_config:
    #   minibatch_size: 32768
    #   mini_epochs: 4
    #   learning_rate: 1e-4
    #   kl_threshold: 0.016
    #   clip_value: True
    #   normalize_input: True
    #   truncate_grads: True

    #   network:
    #     name: actor_critic
    #     central_value: True
    #     mlp:
    #       units: [512]
    #       activation: relu
    #       d2rl: False
    #       initializer:
    #         name: default
    #       regularizer:
    #         name: None
    #     rnn:
    #       name: lstm
    #       units: 1024
    #       layers: 1
    #       before_mlp: True
    #       layer_norm: True
    #       zero_rnn_on_done: False

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
