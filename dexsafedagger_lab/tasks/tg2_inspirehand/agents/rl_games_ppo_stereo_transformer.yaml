params:
  seed: -1

  # environment wrapper clipping
  env:
    # added to the wrapper
    clip_observations: 5.0
    # can make custom wrapper?
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: a2c_stereo_transformer
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      # units: [8192, 4096, 2048, 1024]
      units: [512, 512, 256]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: True
      layer_norm: True
    aux_network: 
      mlp:
        units: [512, 256]
        activation: elu
        out_activation: None # just nn linear layer on output
        d2rl: False

        initializer:
          name: default
        regularizer:
          name: None

    aux_outputs:
      object_pos: {size: 3}

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: shadow_hand_openai_lstm
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    num_actors: -1  # configured from the script (based on num_envs)
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.998
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 64
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    seq_length: 1 # default 20
    bounds_loss_coef: 0.0001

  distillation:
    imitation_loss_type: l2
    unsafe_mode: l2
    unsafe_l2_threshold: 8.0 # default 3.0
    switch_back_min_teacher_steps: 0 # default 10
    
    failure_predictor:
      enabled: false
      obs_key: policy
      hidden_sizes: [256, 128]
      lr: 0.001
      gamma: 0.98
      dropout: 0.0
      buffer_size: 100000 # default 100000
      batch_size: 128 # default 128
      min_samples: 5000 # default 10000
      update_interval: 500 # default 250
      online_train_step_calls: 20 # default 2000# run this many train_step() calls at each update interval
      unsafe_enable_after_steps: 2000
      beta_saturation_threshold: 0.95
      beta_saturation_steps: 500
      beta_saturation_action: error
      horizon_steps: 1 # default 8 
      success_threshold: 0.2
      success_key: lift_success
      output_temperature: 4.0
      include_current_step: false
      pos_weight: null # 2.0 for failure label
      pos_fraction: null # 0.1 for failure label
      device: cuda
      warm_start_model_path: null
    vlm_threshold_advisor:
      enabled: false
      mode: shadow
      base_url: null
      model: null
      api_key_env: null
      update_interval_steps: 10000
      warmup_steps: 2000
      min_samples: 1
      smoothing: 0.1
      l2_min_scale: 0.5
      l2_max_scale: 1.5
      success_min_scale: 0.5
      success_max_scale: 1.5
      max_tokens: 1024
      timeout: 90.0
      visual_buffer_enabled: true
      visual_buffer_size: 64
      visual_capture_interval_steps: 20
      visual_captures_per_step: 2
      visual_samples_per_update: 8
      visual_image_key: img_left
      visual_max_edge: 256
      visual_jpeg_quality: 70
      visual_detail: low
      report_enabled: true
      report_dir: null
    warm_start:
      enabled: true
      collect_steps: 600
      predictor_train_steps: 8000 # default 10000
      save_collected_data: true
      match_predictor_buffer_size: true
      save_steps: 600
      save_envs: 32
      save_images: false
      predictor_overfit_test: true
      predictor_overfit_max_samples: 8192
      predictor_overfit_chunk_size: 1024
      calibrate_success_threshold: true
      success_threshold_quantile: 0.10
      success_threshold_floor: 0.000001
      success_threshold_chunk_size: 4096


    player:
      deterministic: True
      games_num: 100000
      print_stats: True
